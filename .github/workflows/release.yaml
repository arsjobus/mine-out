name: Build and Release

on:
  push:
    tags:
      - 'v*'  # e.g., v1.0.0
  workflow_dispatch:

jobs:
  build-macos:
    name: Build and Release on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          echo "runner: macos-latest"
          echo "homebrew prefix: $(brew --prefix)"
          uname -m

      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install sfml cmake

      - name: Configure CMake for Apple Silicon
        run: |
          cmake -S . -B build-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
            -DCMAKE_PREFIX_PATH=/opt/homebrew

      - name: Run macOS app bundle script
        env:
          BUILDDIR: build-arm64
          APPNAME: MineOut
        run: ./make_macos_app.sh
        shell: bash

      - name: Archive Apple Silicon .app bundle
        run: |
          cd build-arm64
          zip -r mine-out-macos-arm64.zip MineOut.app

      - name: Upload Apple Silicon artifact
        uses: actions/upload-artifact@v4
        with:
          name: mineout-macos-arm64
          path: build-arm64/mine-out-macos-arm64.zip
          retention-days: 7

  build-windows:
    name: Build and Release on Windows (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            arch: x64
            artifact_suffix: x64
            vcpkg_triplet: x64-windows
          - name: x86
            arch: x86
            artifact_suffix: x86
            vcpkg_triplet: x86-windows

    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.vcpkg_triplet }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Clone vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe install sfml:${{ matrix.vcpkg_triplet }}

      - name: Configure CMake for Windows
        shell: pwsh
        run: |
          cmake -S . -B "build-${{ matrix.artifact_suffix }}" -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}

      - name: Build Windows executable
        shell: pwsh
        run: |
          cmake --build "build-${{ matrix.artifact_suffix }}" --config Release

      - name: Locate executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem "build-${{ matrix.artifact_suffix }}" -Recurse -Filter *.exe |
            Where-Object {
              $_.Name -notmatch "test|tests|cmake|uninstall"
            } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host "Contents of build directory:"
            Get-ChildItem "build-${{ matrix.artifact_suffix }}" -Recurse
            throw "No executable found."
          }

          "APP_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare Windows release bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD "build-${{ matrix.artifact_suffix }}/windows-dist"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null

          Copy-Item $env:APP_EXE $bundle

          if (Test-Path "assets") {
            Copy-Item "assets" $bundle -Recurse
          }

          $dllDir = Join-Path $PWD "vcpkg\installed\${{ matrix.vcpkg_triplet }}\bin"

          if (Test-Path $dllDir) {
            Get-ChildItem $dllDir -Filter *.dll |
              Copy-Item -Destination $bundle
          }

          Compress-Archive `
            -Path (Join-Path $bundle "*") `
            -DestinationPath "mine-out-windows-${{ matrix.artifact_suffix }}.zip" `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: mine-out-windows-${{ matrix.artifact_suffix }}
          path: mine-out-windows-${{ matrix.artifact_suffix }}.zip
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mineout-macos-arm64/mine-out-macos-arm64.zip
            dist/mine-out-windows-x64/mine-out-windows-x64.zip
            dist/mine-out-windows-x86/mine-out-windows-x86.zip
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
