name: Build and Release

on:
  push:
    tags:
      - 'v*'  # e.g., v1.0.0
  workflow_dispatch:

jobs:
  build-macos:
    name: Build and Release on macOS (${{ matrix.name }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: apple-silicon
            arch: arm64
            artifact_suffix: arm64
          - name: intel
            arch: x86_64
            artifact_suffix: x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install sfml cmake

      - name: Create build directory
        run: mkdir -p "build-${{ matrix.arch }}"

      - name: Configure CMake
        run: |
          cmake -S . -B "build-${{ matrix.arch }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Run macOS app bundle script
        env:
          BUILDDIR: "build-${{ matrix.arch }}"
          APPNAME: MineOut
        run: ./make_macos_app.sh
        shell: bash

      - name: Archive .app bundle
        run: |
          cd "build-${{ matrix.arch }}"
          zip -r "MineOut-macos-${{ matrix.artifact_suffix }}.zip" MineOut.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mineout-macos-${{ matrix.artifact_suffix }}
          path: "build-${{ matrix.arch }}/MineOut-macos-${{ matrix.artifact_suffix }}.zip"
          retention-days: 7

  build-windows:
    name: Build and Release on Windows
    runs-on: windows-latest

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Clone vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe install sfml:x64-windows

      - name: Configure CMake for Windows
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build Windows executable
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Locate executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter *.exe |
            Where-Object {
              $_.Name -notmatch "test|tests|cmake|uninstall"
            } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host "Contents of build directory:"
            Get-ChildItem build -Recurse
            throw "No executable found."
          }

          "APP_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare Windows release bundle
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD "build/windows-dist"
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null

          Copy-Item $env:APP_EXE $bundle

          foreach ($dir in @("data","fonts","images","music","sfx")) {
            if (Test-Path $dir) {
              Copy-Item $dir $bundle -Recurse
            }
          }

          $dllDir = Join-Path $PWD "vcpkg\installed\x64-windows\bin"

          if (Test-Path $dllDir) {
            Get-ChildItem $dllDir -Filter *.dll |
              Copy-Item -Destination $bundle
          }

          Compress-Archive `
            -Path (Join-Path $bundle "*") `
            -DestinationPath "MineOut-windows.zip" `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: mineout-windows
          path: MineOut-windows.zip
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mineout-macos-arm64/MineOut-macos-arm64.zip
            dist/mineout-macos-x86_64/MineOut-macos-x86_64.zip
            dist/mineout-windows/MineOut-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
