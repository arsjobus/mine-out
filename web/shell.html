  <meta name="theme-color" content="#090d16">
  <title>Mine Out</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #090d16; }
    body { display: grid; place-items: center; }
    canvas { display: block; width: min(100vw, 133.333333vh); height: min(75vw, 100vh); background: #000; outline: none; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <script>
    var Module = {
      canvas: document.getElementById("canvas"),
      print: function () { console.log.apply(console, arguments); },
      printErr: function () { console.error.apply(console, arguments); }
    };
  </script>
